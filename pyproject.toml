[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apiloop"
version = "0.1.0"
description = "Provider-agnostic AI API gateway, router, orchestrator, and credential manager"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Sobuj Miah", email = "sbj@example.com"}
]
keywords = ["ai", "api", "gateway", "router", "openai", "provider", "credential"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
]

[project.scripts]
apiloop = "apiloop.cli:main"

[project.urls]
Homepage = "https://github.com/soobujmiah/apiloop"
Documentation = "https://github.com/soobujmiah/apiloop#readme"
Repository = "https://github.com/soobujmiah/apiloop"
Issues = "https://github.com/soobujmiah/apiloop/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
