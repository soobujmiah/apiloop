name: Repo Knowledge Sync

# This repository had no GitHub Actions workflow at all before this rollout of
# soobujmiah/skb's governance/DETERMINISTIC_STATE_SYNC_POLICY.md. tools/repo_knowledge/ and
# schemas/*.schema.json are vendored copies from soobujmiah/skb -- see
# tools/repo_knowledge/README.md. Do not hand-edit .repo/; it is regenerated by this workflow.
#
# build.status <- `ruff check` (the linter already configured in pyproject.toml).
# test.status  <- `pytest` (the existing tests/ suite, already configured for pytest discovery).
# This is also, incidentally, the first CI this repository has ever had.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.repo/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Run tools/repo_knowledge tests
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py' -v

  sync:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + dev dependencies
        run: pip install --quiet -e ".[dev]" ruff pyyaml

      - name: ruff check (build signal)
        id: build
        continue-on-error: true
        run: ruff check .

      - name: pytest (test signal)
        id: test_step
        continue-on-error: true
        run: pytest

      - name: Run tools/repo_knowledge tests (guard the vendored copy)
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py'

      - name: Collect and sync deterministic state
        if: always()
        run: |
          build_status="${{ steps.build.outcome == 'success' && 'passed' || 'failed' }}"
          test_status="${{ steps.test_step.outcome == 'success' && 'passed' || 'failed' }}"
          python3 -m tools.repo_knowledge sync --ci \
            --build-status "$build_status" --build-run-id "${{ github.run_id }}" \
            --test-status "$test_status" --test-summary "pytest (tests/)" \
            --test-run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --workflow-name "${{ github.workflow }}" \
            --event-type "${{ github.event_name }}" \
            --actor "${{ github.actor }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Verify .repo/ against schemas
        if: always()
        run: python3 -m tools.repo_knowledge verify

      - name: Commit updated .repo/ state
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        env:
          SKB_DISPATCH_TOKEN: ${{ secrets.SKB_DISPATCH_TOKEN || secrets.SKB_RETURN_TOKEN || '' }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .repo; then
            echo "no .repo/ change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .repo
          git commit -m "chore(repo-knowledge): sync deterministic state for ${{ github.sha }}"
          git push origin HEAD:${{ github.ref_name }}
          if [ -n "$SKB_DISPATCH_TOKEN" ]; then
            curl -fsSL -X POST \
              -H "Authorization: Bearer $SKB_DISPATCH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/soobujmiah/skb/dispatches \
              -d "{\"event_type\":\"repo-state-updated\",\"client_payload\":{\"project_id\":\"apiloop\",\"repository\":\"${{ github.repository }}\",\"run_id\":\"${{ github.run_id }}\",\"sha\":\"${{ github.sha }}\"}}" || true
          fi
